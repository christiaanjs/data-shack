services:
  session-client:
    build: .
    restart: unless-stopped
    environment:
      WORKER_URL: ${WORKER_URL:?set WORKER_URL to your data-shack Worker origin}
      AUTH_MODE: ${AUTH_MODE:-dev-token}
      API_TOKEN: ${API_TOKEN:-}
      DEV_TOKEN: ${DEV_TOKEN:-}
      AUTH_CREDENTIALS_PATH: /data/credentials.json
      ENABLE_CATALOG_VIEWS: ${ENABLE_CATALOG_VIEWS:-true}
      LOG_LEVEL: ${LOG_LEVEL:-info}
    # Only needed for AUTH_MODE=oauth-refresh: a writable directory holding the
    # credentials.json produced by `npm run login -- --out data/credentials.json`,
    # so refreshed tokens persist across restarts. Mount the directory, not the
    # file: rotation replaces the file by rename, which a file bind mount refuses.
    # The image runs as UID 10001, so `sudo chown 10001 data` first.
    volumes:
      - ./data:/data
