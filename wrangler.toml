name = "data-shack"
main = "src/index.ts"
compatibility_date = "2025-05-06"

[observability.logs]
enabled = true
invocation_logs = true

[[d1_databases]]
binding = "DB"
database_name = "data-shack-db"
database_id = "b5f7796d-323f-49d0-aca1-e39a64bdb55b"

[[r2_buckets]]
binding = "R2"
bucket_name = "data-shack-storage"

[[kv_namespaces]]
binding = "PROXY_CREDS_KV"
id = "bead93e6e210407094d6fa99327784b5"

[[durable_objects.bindings]]
name = "CATALOG"
class_name = "CatalogDO"

[[durable_objects.bindings]]
name = "SESSION_DO"
class_name = "SessionDO"

# Uncomment to enable wake-on-query container sessions (see
# container/README.md and SessionDO's "Container lifecycle" section) —
# requires the Workers Paid plan + Containers entitlement, and Docker
# available wherever you run `wrangler deploy`/`wrangler dev`. Until
# uncommented, SessionDO behaves exactly as before (ctx.container is
# undefined, every container code path no-ops).
#
# Wake-on-query is for ONE user only: also set CONTAINER_OWNER_USER_ID (a user id,
# see GET /me) in [vars] / [env.staging.vars]. Other users never wake a container,
# and with it unset nobody does.
# [[containers]]
# class_name = "SessionDO"
# image = "./container/Dockerfile"
# instance_type = "standard-1"  # DuckDB wants more than the "lite"/"basic" default — verify against real usage
# max_instances = 50            # one per concurrently-active user; tune to your usage

[[migrations]]
tag = "v1"
new_sqlite_classes = ["CatalogDO"]

[[migrations]]
tag = "v2"
new_sqlite_classes = ["SessionDO"]

[[queues.producers]]
binding = "LOAD_JOB_QUEUE"
queue   = "data-shack-load-jobs"

[[queues.consumers]]
queue             = "data-shack-load-jobs"
max_batch_size    = 10
max_batch_timeout = 1
max_retries       = 3

[triggers]
crons = ["* * * * *"]

[vars]
ENABLE_OAUTH = "true"
ALLOWED_ORIGIN = "https://data-shack.pages.dev"
DEFAULT_OAUTH_PROVIDER = "google"

# Secrets (never put values here — set via: wrangler secret put <NAME>)
# GOOGLE_CLIENT_ID
# GOOGLE_CLIENT_SECRET
# JWT_SECRET
# DEV_TOKEN
# DEV_USER_ID

# ── Staging environment ───────────────────────────────────────────────────
[env.staging]
name = "data-shack-staging"

[[env.staging.d1_databases]]
binding = "DB"
database_name = "data-shack-db-staging"
database_id = "1910faa5-f94e-4e15-aedd-648e604a6915"

[[env.staging.r2_buckets]]
binding = "R2"
bucket_name = "data-shack-storage-staging"

[[env.staging.kv_namespaces]]
binding = "PROXY_CREDS_KV"
id = "122d990587e9476e95dedb426b5fbf37"

[[env.staging.durable_objects.bindings]]
name = "CATALOG"
class_name = "CatalogDO"

[[env.staging.durable_objects.bindings]]
name = "SESSION_DO"
class_name = "SessionDO"

# See the commented [[containers]] block above the root migrations — same
# idea, scoped to staging. Wrangler environments don't inherit array-type
# config from root (same reason durable_objects.bindings is duplicated
# above), so this needs its own [[env.staging.containers]] entry too.
# [[env.staging.containers]]
# class_name = "SessionDO"
# image = "./container/Dockerfile"
# instance_type = "standard-1"
# max_instances = 20

[[env.staging.queues.producers]]
binding = "LOAD_JOB_QUEUE"
queue   = "data-shack-load-jobs-staging"

[[env.staging.queues.consumers]]
queue          = "data-shack-load-jobs-staging"
max_batch_size = 10
max_retries    = 3

[env.staging.triggers]
crons = ["* * * * *"]

[env.staging.vars]
ENABLE_OAUTH = "true"
ALLOWED_ORIGIN = "https://data-shack-staging.pages.dev"
ALLOW_ORIGIN_SUBDOMAINS = "true"
DEFAULT_OAUTH_PROVIDER = "google"

# Secrets for staging (set via: wrangler secret put <NAME> --env staging)
# GOOGLE_CLIENT_ID
# GOOGLE_CLIENT_SECRET
# JWT_SECRET
# DEV_TOKEN
# DEV_USER_ID
