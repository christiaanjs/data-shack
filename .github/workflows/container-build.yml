name: Container image

on:
  push:
    branches: [main]
    paths:
      - "container/**"
      - ".github/workflows/container-build.yml"
  pull_request:
    branches: [main]
    paths:
      - "container/**"
      - ".github/workflows/container-build.yml"

concurrency:
  group: container-build-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}/session-container

jobs:
  build:
    name: Build session container image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Pushing needs a registry login, which only works with the real
      # GITHUB_TOKEN permissions a same-repo trigger gets — a pull_request
      # from a fork gets a read-only token, so for those we still build (to
      # catch a broken Dockerfile) but skip the push.
      - name: Determine whether to push
        id: push
        run: |
          if [[ "${{ github.event_name }}" == "push" ]]; then
            echo "push=true" >> "$GITHUB_OUTPUT"
          elif [[ "${{ github.event_name }}" == "pull_request" && "${{ github.event.pull_request.head.repo.full_name }}" == "${{ github.repository }}" ]]; then
            echo "push=true" >> "$GITHUB_OUTPUT"
          else
            echo "push=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Log in to GHCR
        if: steps.push.outputs.push == 'true'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # main -> tag "main"; a PR -> tag "pr-<number>" (never "latest" or a
      # tag that could be mistaken for a release build off master).
      - name: Compute image tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=sha,prefix=sha-,format=short

      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: container
          push: ${{ steps.push.outputs.push == 'true' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
